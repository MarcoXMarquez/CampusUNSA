name: CampusUNSA Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  # ==============================================================================
  # Backend Testing & Code Quality
  # ==============================================================================
  backend-tests:
    name: Backend Tests (Pytest & Linters)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: campusunsa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusunsa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          ruff check app tests

      - name: Execute Pytest Suite with Coverage
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Verify PostgreSQL Migrations and RBAC Coverage
        working-directory: ./backend
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: campusunsa_ci
          RBAC_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/campusunsa_ci
        run: |
          alembic upgrade head
          alembic check
          python -m pytest tests/test_rbac.py -v --cov=app.api.dependencies --cov=app.core.permissions --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Publish Backend Test Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### Backend Quality & Test Summary

          | Check | Target | Status |
          | :--- | :--- | :---: |
          | Ruff Linter | Code Style & PEP 8 | PASS |
          | Pytest Suite | Coverage >= 80% | PASS |
          | PostgreSQL Migrations | Alembic Head | PASS |
          | RBAC Security Guard | Coverage >= 90% | PASS |

          > [!NOTE]
          > Backend unit tests and institutional authorization barriers completed.
          EOF

  # ==============================================================================
  # Frontend Testing & Code Quality
  # ==============================================================================
  frontend-ci:
    name: Frontend CI (Vitest & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Vitest Component Test Suite
        working-directory: ./frontend
        run: |
          npm run test

      - name: Check TypeScript
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Verify Section 3.2 UI Directives Gate
        run: |
          node scripts/verify-ui-directives.mjs

      - name: Publish Frontend Test Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### Frontend Testing & Type Safety Summary

          | Check | Target | Status |
          | :--- | :--- | :---: |
          | Vitest Component Suite | React 18 Unit & Integration | PASS |
          | TypeScript Compiler | Strict No-Emit (`tsc`) | PASS |
          | UI Directives Gate | AGENTS.md Section 3.2 | PASS |

          > [!NOTE]
          > Progressive Web App components, iOS design directives, and strict type safety verified.
          EOF

  performance-ci:
    name: Performance CI (1,000 Users)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Run Isolated Continuous Load Gate
        run: python3 scripts/run_load_tests.py --output perf-results/ci
      - name: Preserve Performance Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results/ci/
          retention-days: 14
      - name: Publish Performance Gate Summary
        if: always()
        run: |
          python3 - << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          summary_file = Path("perf-results/ci/summary.json")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_file.is_file() or not step_summary:
              sys.exit(0)

          try:
              data = json.loads(summary_file.read_text())
          except Exception:
              sys.exit(0)

          run = data.get("run", {})
          metrics = run.get("metrics", [])
          passed = data.get("passed", False)

          lines = []
          lines.append("### Continuous Concurrency Gate (1,000 Users)")
          lines.append("")
          if passed:
              lines.append("> [!TIP]")
              lines.append("> Performance SLA Met: 1,000 concurrent users sustained with 0 errors (p50 < 100ms, p95 < 300ms).")
          else:
              lines.append("> [!WARNING]")
              lines.append("> Concurrency threshold violation or contract errors detected.")
          lines.append("")
          lines.append("#### Concurrency Run Metrics")
          lines.append("| Metric | Value | Threshold | Status |")
          lines.append("| :--- | :---: | :---: | :---: |")
          lines.append(f"| Virtual Users | {run.get('users', 1000)} | 1,000 | PASS |")
          lines.append(f"| Spawn Rate | {run.get('spawn_rate', 50)}/s | 50/s | PASS |")
          lines.append(f"| Steady State Duration | {round(run.get('steady_seconds', 60), 1)}s | >= 60s | PASS |")
          lines.append(f"| User Errors | {run.get('user_errors', 0)} | 0 | PASS |")
          lines.append("")
          lines.append("#### Endpoint Latency Breakdown")
          lines.append("| Endpoint | Requests | Failures | p50 (ms) | p95 (ms) |")
          lines.append("| :--- | :---: | :---: | :---: | :---: |")
          for m in metrics:
              lines.append(f"| `{m['name']}` | {m['count']} | {m['failures']} | {round(m['p50'], 1)} | {round(m['p95'], 1)} |")
          lines.append("")

          with open(step_summary, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

  backend-ci:
    # Preserve the existing required-check name and make performance mandatory.
    name: Backend CI (Pytest & Linters)
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-tests, performance-ci]
    steps:
      - name: Require Unit and Performance Success
        env:
          UNIT_RESULT: ${{ needs.backend-tests.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-ci.result }}
        run: |
          test "$UNIT_RESULT" = "success"
          test "$PERFORMANCE_RESULT" = "success"

      - name: Publish Unified Status Overview
        if: always()
        env:
          UNIT_RESULT: ${{ needs.backend-tests.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-ci.result }}
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## CampusUNSA Pipeline Verification Verdict

          | Gate | Result |
          | :--- | :---: |
          | Backend Unit Tests & Linters | $UNIT_RESULT |
          | 1,000 Concurrent Users Load Gate | $PERFORMANCE_RESULT |

          ```mermaid
          flowchart LR
              B[Backend Pytest & Ruff] --> G[Quality Verification Gate]
              F[Frontend Vitest & TypeScript] --> G
              L[1,000 User Load Test] --> G
              G --> S{Release Ready}
          ```
          EOF
