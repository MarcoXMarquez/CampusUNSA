name: CampusUNSA Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  # ==============================================================================
  # Backend Testing & Code Quality
  # ==============================================================================
  backend-ci:
    name: Backend CI (Pytest & Linters)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          ruff check app tests

      - name: Execute Pytest Suite with Coverage
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing

  # ==============================================================================
  # Frontend Testing & Code Quality
  # ==============================================================================
  frontend-ci:
    name: Frontend CI (Vitest & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run Vitest Component Test Suite
        working-directory: ./frontend
        run: |
          npm run test
