name: "Oppia-Caliber Wiki Synchronization"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/wiki/wiki_engine.py"
      - "scripts/wiki/wiki_validator.py"
      - ".agents/skills/campusunsa-wiki-orchestrator/**"

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Validate and Synchronize GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Refresh and Publish the Existing Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          TMP_WIKI_DIR=$(mktemp -d)
          if ! git clone "$WIKI_REPO" "$TMP_WIKI_DIR"; then
            echo "Notice: Repository wiki is not yet initialized or enabled on GitHub."
            exit 0
          fi

          python3 scripts/wiki/wiki_engine.py --init --wiki-dir "$TMP_WIKI_DIR"
          python3 scripts/wiki/wiki_validator.py "$TMP_WIKI_DIR"

          git -C "$TMP_WIKI_DIR" config user.name "github-actions[bot]"
          git -C "$TMP_WIKI_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TMP_WIKI_DIR" add -- .
          if git -C "$TMP_WIKI_DIR" diff-index --quiet HEAD; then
            echo "No wiki documentation updates detected."
          else
            git -C "$TMP_WIKI_DIR" commit -m "docs(wiki): synchronize Oppia-caliber documentation pages"
            git -C "$TMP_WIKI_DIR" push origin HEAD
            echo "Wiki successfully synchronized."
          fi
